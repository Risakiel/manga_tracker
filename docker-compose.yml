services:
  manga-tracker:
    # Build locally with `docker compose build`, or switch to the published image:
    # image: ghcr.io/<votre-user-github>/manga_tracker:latest
    build: .
    container_name: manga-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Read-only NAS share holding the actual manga/pornhwa folders. Must
      # contain exactly two subdirectories: "Manga" and "Pornhwa".
      - /mnt/remotes/192.168.1.41_Komga:/library:ro
    environment:
      SUWAYOMI_URL: "http://192.168.1.96:4567"
      SUWAYOMI_USERNAME: ""
      SUWAYOMI_PASSWORD: ""
      KOMGA_URL: "http://192.168.1.90:25600"
      KOMGA_API_KEY: ""
      SYNC_INTERVAL_HOURS: "24"
      SUWAYOMI_SYNC_INTERVAL_HOURS: "24"
      KOMGA_SYNC_INTERVAL_HOURS: "24"
      ENABLE_SCHEDULER: "true"
      LIBRARY_ROOT: "/library"
